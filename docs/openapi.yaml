      responses:
        '200':
          description: Updated booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Payments ──────────────────────────────
  /bookings/{booking_id}/payments:
    parameters:
      - in: path
        name: booking_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Payments]
      summary: List payments for a booking
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{booking_id}/payments/intent:
    parameters:
      - in: path
        name: booking_id
        required: true
        schema: { type: string, format: uuid }

    post:
      tags: [Payments]
      summary: Create a Stripe Payment Intent (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [deposit, balance, full]
      responses:
        '201':
          description: Stripe client secret returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Payment already completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payments/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook — payment confirmation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid Stripe signature

  # ── Widget ────────────────────────────────
  /properties/{property_id}/widget:
    parameters:
      - in: path
        name: property_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Widget]
      summary: Get widget configuration
      responses:
        '200':
          description: Widget configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetConfig' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Widget]
      summary: Create or replace widget configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetConfigUpdate' }
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetConfig' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties/{property_id}/widget/snippet:
    parameters:
      - in: path
        name: property_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Widget]
      summary: Generate the HTML embed snippet
      responses:
        '200':
          description: HTML snippet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetSnippet' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── iCal Sync ─────────────────────────────
  /properties/{property_id}/ical-syncs:
    parameters:
      - in: path
        name: property_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Sync]
      summary: List iCal syncs for a property
      responses:
        '200':
          description: iCal syncs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ICalSync' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Sync]
      summary: Add an iCal feed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ICalSyncCreate' }
      responses:
        '201':
          description: iCal feed added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ICalSync' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /properties/{property_id}/ical-syncs/{sync_id}:
    parameters:
      - in: path
        name: property_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: sync_id
        required: true
        schema: { type: string, format: uuid }

    delete:
      tags: [Sync]
      summary: Remove an iCal feed
      responses:
        '204':
          description: iCal feed removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties/{property_id}/ical-syncs/{sync_id}/trigger:
    parameters:
      - in: path
        name: property_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: sync_id
        required: true
        schema: { type: string, format: uuid }

    post:
      tags: [Sync]
      summary: Manually trigger an iCal sync
      responses:
        '200':
          description: Sync triggered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ICalSync' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Event Log ─────────────────────────────
  /events:
    get:
      tags: [Events]
      summary: List audit log events
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [auth, booking, payment, property, sync, widget]
        - in: query
          name: level
          schema:
            type: string
            enum: [info, warning, error]
        - in: query
          name: resource_id
          schema: { type: string, format: uuid }
        - in: query
          name: start_date
          schema: { type: string, format: date-time }
        - in: query
          name: end_date
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventLog' }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Managers (admin) ──────────────────────
  /managers:
    get:
      tags: [Managers]
      summary: List all managers
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Filter by name or email
        - in: query
          name: deleted
          schema: { type: boolean }
          description: Include soft-deleted managers
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Manager' }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Managers]
      summary: Create a manager account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerCreate' }
      responses:
        '201':
          description: Manager created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manager' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /managers/{manager_id}:
    parameters:
      - in: path
        name: manager_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Managers]
      summary: Get any manager's details
      responses:
        '200':
          description: Manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manager' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Managers]
      summary: Update any manager's account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerAdminUpdate' }
      responses:
        '200':
          description: Updated manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manager' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [Managers]
      summary: Delete a manager account (soft delete)
      responses:
        '204':
          description: Manager marked as deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managers/{manager_id}/restore:
    parameters:
      - in: path
        name: manager_id
        required: true
        schema: { type: string, format: uuid }

    post:
      tags: [Managers]
      summary: Restore a soft-deleted manager
      responses:
        '200':
          description: Manager restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manager' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managers/{manager_id}/roles:
    parameters:
      - in: path
        name: manager_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Managers]
      summary: List roles assigned to a manager
      responses:
        '200':
          description: Assigned roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagerRole' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Managers]
      summary: Assign a role to a manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string, format: uuid }
      responses:
        '201':
          description: Role assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerRole' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Role already assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /managers/{manager_id}/roles/{role_id}:
    parameters:
      - in: path
        name: manager_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: role_id
        required: true
        schema: { type: string, format: uuid }

    delete:
      tags: [Managers]
      summary: Remove a role from a manager
      responses:
        '204':
          description: Role removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managers/{manager_id}/2fa/reset:
    parameters:
      - in: path
        name: manager_id
        required: true
        schema: { type: string, format: uuid }

    post:
      tags: [Managers]
      summary: Reset 2FA for a manager
      description: Disables 2FA without requiring the current TOTP code. Used when a manager has lost access to their authenticator app.
      responses:
        '204':
          description: 2FA reset — manager must re-enroll on next login
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managers/{manager_id}/properties:
    parameters:
      - in: path
        name: manager_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Managers]
      summary: List properties belonging to a manager
      parameters:
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Property' }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /managers/{manager_id}/bookings:
    parameters:
      - in: path
        name: manager_id
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Managers]
      summary: List bookings belonging to a manager
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, cancelled, refunded]
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
