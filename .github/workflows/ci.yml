## CI CD github workflow

name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  #  Build: compile the Docker image and push it to GHCR, tagged with the commit SHA
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (tagged with commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: DevSecOps — scan image for vulnerabilities (Trivy) ## Github registry can do this itself if needed, or we can use an integrated trivy in registry like an self hosted harbor
      #   uses: aquasecurity/trivy-action@0.28.0
      #   with:
      #     image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
      #     format: table
      #     severity: CRITICAL,HIGH
      #     exit-code: "0" # informational: surfaced in logs, does not block the pipeline
      #     output: trivy-report.txt

      # - name: Publish Trivy report to job summary
      #   if: always()
      #   run: |
      #     echo "## Trivy vulnerability scan" >> "$GITHUB_STEP_SUMMARY"
      #     echo '```' >> "$GITHUB_STEP_SUMMARY"
      #     cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
      #     echo '```' >> "$GITHUB_STEP_SUMMARY"

  #  Test: run the unit test suite inside the image built above
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image built by the build job
        run: docker pull ${{ needs.build.outputs.image }}:${{ github.sha }}

      - name: Run test suite in the built image
        run: |
          mkdir -p ci-out/coverage
          docker run --rm -v "$PWD/ci-out:/out" ${{ needs.build.outputs.image }}:${{ github.sha }} \
            sh -c "bun test --reporter=junit --reporter-outfile=/out/junit.xml --coverage --coverage-reporter=lcov --coverage-dir=/out/coverage"

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests (bun test)
          path: ci-out/junit.xml
          reporter: java-junit

      - name: Install lcov (genhtml)
        if: always()
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Publish coverage summary
        uses: zgosalvez/github-actions-report-lcov@v4
        if: always()
        with:
          coverage-files: ci-out/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test & coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ci-out/junit.xml
            ci-out/coverage/lcov.info

  #  Quality: static analysis and DevSecOps checks
  quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate types
        run: bunx prisma generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: DevSecOps — dependency vulnerability audit
        run: bun audit --audit-level=high

      - name: DevSecOps — secret scan (Gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git -v

  #  Deploy: publish the validated image as :latest
  deploy:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote validated image to :latest
        run: |
          docker pull ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker tag ${{ steps.image.outputs.name }}:${{ github.sha }} ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:latest

      - name: Deployment summary
        run: |
          echo "## Deployed image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.image.outputs.name }}:latest\` (from \`${{ github.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
